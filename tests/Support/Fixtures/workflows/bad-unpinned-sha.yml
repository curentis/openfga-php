name: Bad Unpinned

on:
  push:

permissions: {}

concurrency:
  group: bad
  cancel-in-progress: true

jobs:
  bad:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      - uses: actions/checkout@v5
