name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_NO_INTERACTION: "1"
  PHP_CS_FIXER_IGNORE_ENV: "1"

jobs:
  check:
    name: check (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        deps: [locked, lowest]
        exclude:
          # prefer-lowest dev-toolchain (Psalm/Amp) is not PHP 8.5-clean; locked deps cover 8.5.
          - php: "8.5"
            deps: lowest
        include:
          # The lock pins Guzzle 7; this cell runs the concurrent sender against Guzzle 8.
          - php: "8.4"
            deps: guzzle8
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.lock') }}
      - if: matrix.deps == 'locked'
        run: composer install --prefer-dist --no-progress
      - if: matrix.deps == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress
      - if: matrix.deps == 'guzzle8'
        run: |
          composer install --prefer-dist --no-progress
          composer update guzzlehttp/guzzle --with-all-dependencies --prefer-dist --no-progress
          composer show guzzlehttp/guzzle | grep -E '^versions : \* 8\.'
      - run: composer audit --locked --abandoned=ignore
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: composer workflows
      - run: composer cs
      # Guzzle 8's promise generics are stricter than 7's; static analysis runs on the locked Guzzle 7 cells.
      - if: matrix.deps != 'guzzle8'
        run: composer phpstan
      - if: matrix.deps != 'guzzle8'
        run: composer psalm
      - run: composer codegen:check
      - run: composer test:architecture
      - run: composer test:unit
      - run: composer test:contract
      - run: composer ignore-budget
      - if: matrix.php == '8.3' && matrix.deps == 'locked'
        run: composer test:unit:coverage
      - if: matrix.php == '8.3' && matrix.deps == 'locked'
        run: composer test:mutation
      - if: matrix.php == '8.3' && matrix.deps == 'locked'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            build/clover.xml
            build/coverage-xml/junit.xml
          if-no-files-found: error

  integration:
    name: integration (PHP ${{ matrix.php }}, OpenFGA ${{ matrix.openfga }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        openfga: ["v1.10.0", "v1.21.0"]
    env:
      FGA_API_URL: http://localhost:8080
      FGA_PRESHARED_API_URL: http://localhost:8081
      FGA_PRESHARED_KEY: ci-preshared-key
      FGA_REQUIRE_SERVER: "1"
      OPENFGA_VERSION: ${{ matrix.openfga }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 8080:8080 "openfga/openfga:${OPENFGA_VERSION}" run --playground-enabled=false
          docker run -d --name openfga-preshared -p 8081:8080 "openfga/openfga:${OPENFGA_VERSION}" run \
            --playground-enabled=false --authn-method=preshared --authn-preshared-keys="${FGA_PRESHARED_KEY}"
          for url in http://localhost:8080 http://localhost:8081; do
            ready=0
            for i in $(seq 1 60); do curl -fsS "$url/healthz" && ready=1 && break; sleep 1; done
            if [ "$ready" != 1 ]; then docker logs openfga; docker logs openfga-preshared; exit 1; fi
          done
      - run: composer test:integration
      - if: failure()
        run: |
          docker logs openfga
          docker logs openfga-preshared

  coverage:
    name: coverage
    needs: check
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: build
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/clover.xml
          flags: unit
          use_oidc: true
          fail_ci_if_error: false
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: build/coverage-xml/junit.xml
          use_oidc: true

  gate:
    name: gate
    if: always()
    needs: [check, integration, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
